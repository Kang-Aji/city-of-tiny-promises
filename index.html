<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City of Tiny Promises</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="difficultyMenu" class="modal">
        <div class="modal-content difficulty-modal">
            <h2>Choose Your City</h2>
            <p>Select a difficulty level and aesthetic</p>
            <div class="difficulty-buttons">
                <button id="nycBtn" class="difficulty-btn nyc-btn">
                    <div class="difficulty-title">New York City</div>
                    <div class="difficulty-desc">Easy - Classic urban experience</div>
                </button>
                <button id="sfBtn" class="difficulty-btn sf-btn">
                    <div class="difficulty-title">San Francisco</div>
                    <div class="difficulty-desc">Hard - Includes deceptive requests</div>
                </button>
            </div>
        </div>
    </div>

    <div id="gameContainer" class="hidden">
        <header id="gameHeader">
            <div class="header-top">
                <h1>City of Tiny Promises</h1>
                <div class="sound-controls">
                    <button id="soundToggle" class="sound-btn" title="Toggle sound">🔊</button>
                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70" title="Volume">
                </div>
            </div>
            <div id="stats">
                <div class="stat">
                    <span class="stat-label">Community Score:</span>
                    <span id="communityScore">50</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Requests Fulfilled:</span>
                    <span id="requestsFulfilled">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Requests Ignored:</span>
                    <span id="requestsIgnored">0</span>
                </div>
            </div>
        </header>

        <main id="gameMain">
            <div id="cityStreet">
                <div id="skyline" class="nyc-skyline">
                    <div class="skyscraper" style="left: 0%; height: 85%; width: 8%;"></div>
                    <div class="skyscraper tall" style="left: 8%; height: 95%; width: 7%;"></div>
                    <div class="skyscraper" style="left: 15%; height: 75%; width: 8%;"></div>
                    <div class="skyscraper tall" style="left: 23%; height: 100%; width: 9%;"></div>
                    <div class="skyscraper" style="left: 32%; height: 70%; width: 7%;"></div>
                    <div class="skyscraper tall" style="left: 39%; height: 98%; width: 8%;"></div>
                    <div class="skyscraper" style="left: 47%; height: 80%; width: 8%;"></div>
                    <div class="skyscraper tall" style="left: 55%; height: 96%; width: 9%;"></div>
                    <div class="skyscraper" style="left: 64%; height: 72%; width: 7%;"></div>
                    <div class="skyscraper tall" style="left: 71%; height: 94%; width: 8%;"></div>
                    <div class="skyscraper" style="left: 79%; height: 78%; width: 8%;"></div>
                    <div class="skyscraper tall" style="left: 87%; height: 92%; width: 9%;"></div>
                    <div class="skyscraper" style="left: 96%; height: 68%; width: 4%;"></div>
                </div>
                <div id="sf-skyline" class="sf-skyline hidden">
                    <div class="sf-building" style="left: 2%; height: 70%; width: 6%;"></div>
                    <div class="sf-building tall" style="left: 8%; height: 88%; width: 7%;"></div>
                    <div class="sf-building" style="left: 15%; height: 65%; width: 6%;"></div>
                    <div class="sf-building pyramid" style="left: 21%; height: 92%; width: 8%;"></div>
                    <div class="sf-building" style="left: 29%; height: 60%; width: 6%;"></div>
                    <div class="sf-building tall" style="left: 35%; height: 85%; width: 7%;"></div>
                    <div class="sf-building" style="left: 42%; height: 75%; width: 6%;"></div>
                    <div class="sf-building pyramid" style="left: 48%; height: 90%; width: 8%;"></div>
                    <div class="sf-building" style="left: 56%; height: 68%; width: 6%;"></div>
                    <div class="sf-building tall" style="left: 62%; height: 87%; width: 7%;"></div>
                    <div class="sf-building" style="left: 69%; height: 72%; width: 6%;"></div>
                    <div class="sf-building pyramid" style="left: 75%; height: 89%; width: 8%;"></div>
                    <div class="sf-building" style="left: 83%; height: 64%; width: 6%;"></div>
                    <div class="sf-building tall" style="left: 89%; height: 86%; width: 7%;"></div>
                    <div class="sf-building" style="left: 96%; height: 62%; width: 4%;"></div>
                </div>
                <div id="streetContainer">
                    <!-- Citizens and their requests will appear here -->
                </div>
                <div class="street-ground">
                    <div class="street-element bench" style="left: 5%;"></div>
                    <div class="street-element tree" style="left: 15%;"></div>
                    <div class="street-element lamp" style="left: 25%;"></div>
                    <div class="street-element bench" style="left: 40%;"></div>
                    <div class="street-element tree" style="left: 55%;"></div>
                    <div class="street-element lamp" style="left: 70%;"></div>
                    <div class="street-element bench" style="left: 85%;"></div>
                </div>
            </div>

            <div id="requestQueue">
                <h3>Active Requests</h3>
                <div id="activeRequests">
                    <!-- Active requests will be listed here -->
                </div>
            </div>
        </main>

        <div id="endGameModal" class="modal hidden">
            <div class="modal-content">
                <h2>Your Community</h2>
                <div id="endGameScene"></div>
                <div id="finalStats"></div>
                <button id="restartBtn">Start New Community</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
